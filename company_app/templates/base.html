<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Invoice Desk{% endblock %} | Demo Company</title>
  <style>
    :root { color-scheme: light; --ink: #1c2d29; --muted: #63736d; --line: #dce5e1; --paper: #fff; --ground: #f3f7f5; --accent: #087b69; --accent-dark: #056252; --danger: #9a302d; --ok: #145d43; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--ground); color: var(--ink); font: 16px/1.5 "Segoe UI", sans-serif; }
    header { background: var(--paper); border-bottom: 1px solid var(--line); }
    .topbar, main { width: min(980px, calc(100% - 32px)); margin: 0 auto; }
    .topbar { min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { color: var(--ink); font-size: 18px; font-weight: 700; text-decoration: none; }
    nav { display: flex; align-items: center; gap: 18px; }
    nav a { color: var(--muted); text-decoration: none; }
    nav a:hover { color: var(--accent-dark); }
    nav form { margin: 0; }
    main { padding: 40px 0 64px; }
    h1 { margin: 0 0 8px; font-size: 28px; line-height: 1.2; }
    p { margin: 0 0 16px; }
    .muted { color: var(--muted); }
    .panel { max-width: 680px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 24px; }
    .page-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    .page-head p { margin: 0; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; }
    input { width: 100%; min-height: 42px; padding: 9px 11px; border: 1px solid #aebdb6; border-radius: 4px; color: var(--ink); font: inherit; }
    input:focus { outline: 2px solid #65b9a7; outline-offset: 1px; border-color: var(--accent); }
    button, .button { display: inline-flex; min-height: 40px; align-items: center; justify-content: center; padding: 8px 14px; border: 0; border-radius: 4px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
    button:hover, .button:hover { background: var(--accent-dark); }
    .button.secondary, button.secondary { background: #e6efeb; color: var(--ink); }
    .button.secondary:hover, button.secondary:hover { background: #d7e5df; }
    .actions { display: flex; gap: 10px; margin-top: 22px; }
    .alert { margin: 18px 0; padding: 12px 14px; border-radius: 4px; background: #e8f4ee; color: var(--ok); }
    .alert.error { background: #fff0ee; color: var(--danger); }
    .demo-note { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
    code { padding: 2px 5px; border-radius: 3px; background: #edf2ef; font-family: Consolas, monospace; }
    .table-wrap { overflow-x: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 13px 15px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { background: #f7faf8; color: var(--muted); font-size: 13px; font-weight: 700; }
    tbody tr:last-child td { border-bottom: 0; }
    .empty { padding: 36px 20px; text-align: center; color: var(--muted); }
    @media (max-width: 560px) { .topbar { align-items: flex-start; flex-direction: column; justify-content: center; padding: 12px 0; gap: 8px; } nav { gap: 14px; } main { padding-top: 28px; } .page-head { align-items: flex-start; flex-direction: column; } .panel { padding: 18px; } }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <a class="brand" href="/invoices">Demo Company / Invoice Desk</a>
      {% if request.session.get("authenticated") %}
      <nav aria-label="Main navigation">
        <a href="/invoices">Invoices</a>
        <a href="/invoices/new">Add invoice</a>
        <form action="/logout" method="post"><button class="secondary" type="submit">Sign out</button></form>
      </nav>
      {% endif %}
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
