{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="panel" aria-labelledby="login-title">
  <h1 id="login-title">Company sign in</h1>
  <p class="muted">Invoice workspace</p>
  {% if error %}<div class="alert error" role="alert">{{ error }}</div>{% endif %}
  {% if not credentials_configured %}<div class="alert" role="status">Configure app login in the project .env before signing in.</div>{% endif %}
  <form action="/login" method="post">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <div class="actions"><button type="submit">Sign in</button></div>
  </form>
</section>
{% endblock %}
